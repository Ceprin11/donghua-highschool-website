name: Deploy review site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tencent-review
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source and prepared lab resources
        run: |
          npm run lint
          npm run typecheck
          npx vite build
          npm test

      - name: Save the verified site build
        uses: actions/upload-artifact@v4
        with:
          name: review-dist-${{ github.sha }}
          path: dist
          retention-days: 1

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: review
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4

      - name: Download the verified site build
        uses: actions/download-artifact@v4
        with:
          name: review-dist-${{ github.sha }}
          path: dist

      - name: Configure deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/tencent_review
          chmod 600 ~/.ssh/tencent_review

      - name: Synchronize only changed files
        run: |
          ssh_command="ssh -i ~/.ssh/tencent_review -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=20"
          rsync -az --delete \
            --exclude='/experiments/transformer/model-v2/***' \
            -e "$ssh_command" \
            dist/ ubuntu@118.89.188.169:/opt/donghua-ai/dist/
          rsync -az \
            -e "$ssh_command" \
            package.json package-lock.json .npmrc .dockerignore \
            server shared migrations scripts deploy \
            ubuntu@118.89.188.169:/opt/donghua-ai/

      - name: Deploy the exact commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/tencent_review \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            ubuntu@118.89.188.169 \
            "bash -s -- '$DEPLOY_SHA'" <<'REMOTE'
          set -euo pipefail
          deploy_root=/opt/donghua-ai
          cd "$deploy_root"
          test -f dist/experiments/transformer/model-v2/manifest.json
          sudo docker compose -f deploy/compose.review.yml build app
          previous_image=$(sudo docker inspect --format '{{.Image}}' donghua-ai-app-1)
          sudo install -m 700 -d "$deploy_root/backups"
          backup_name="$1-$(date -u +%Y%m%dT%H%M%SZ)"
          sudo docker stop --time 30 donghua-ai-app-1
          if ! sudo docker run --rm --user 0 -e DATA_DIR=/data \
            -v "$deploy_root/data:/data" -v "$deploy_root/backups:/backups" \
            "$previous_image" node scripts/backup.mjs --stopped --out "/backups/$backup_name"; then
            sudo docker start donghua-ai-app-1
            exit 1
          fi
          sudo docker compose -f deploy/compose.review.yml up -d --wait --wait-timeout 240
          curl --fail --silent --show-error http://127.0.0.1/api/health
          printf '%s\n' "$1" > .deployed-revision
          REMOTE
