<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教 AI 认识姿势</title><link rel="stylesheet" href="./style.css"><script defer src="./main.js"></script></head>
<body>
<header class="project-header"><div class="project-title"><span class="pose-mark" aria-hidden="true">✦</span><div><h1>教 AI 认识姿势</h1><span>姿势项目</span></div></div><button id="clear-all" disabled>清空项目</button></header>
<main class="workspace">
<section class="classes" aria-label="姿势类别"><div id="classes"></div><button id="add-class" disabled class="add-class">＋ 添加类别</button><button id="examples" disabled class="example-button">载入站立与下蹲示例</button><p class="note">示例取自 TensorFlow 官方测试视频。换一个人、角度或距离，看看模型的表现。</p></section>
<section class="training card"><h2>训练</h2><div class="training-body"><button id="train" class="primary" disabled>训练模型</button><button id="stop-training" hidden>停止训练</button><progress id="progress" value="0" max="50" hidden></progress><p id="status" role="status">每个类别添加至少 5 个姿势样本</p><p id="loss"></p></div><details class="advanced"><summary>高级设置</summary><div><label>训练轮数<input id="epochs" type="number" min="1" max="100" value="50"></label><label>批量大小<select id="batch"><option>8</option><option selected>16</option><option>32</option></select></label><label>学习率<select id="learning-rate"><option selected>0.0001</option><option>0.001</option><option>0.01</option></select></label></div></details></section>
<section class="preview card"><div class="preview-header"><h2>预览</h2><button id="export" disabled>↓ 导出模型</button></div><div class="preview-body"><p id="preview-help">训练完成后，在这里测试新姿势。</p><div class="video-area"><video id="video" autoplay playsinline muted hidden></video><canvas id="preview" width="257" height="257" hidden></canvas><div id="preview-empty"><svg viewBox="0 0 100 110" aria-hidden="true"><circle cx="50" cy="19" r="10"/><path d="M50 34v32M24 44l26-10 26 10M50 66l-20 30M50 66l20 30"/></svg><span>让身体成为模型的输入</span></div></div><div class="camera-controls"><button id="camera" disabled>开启摄像头</button><button id="camera-stop" disabled>关闭摄像头</button><label class="file-button">测试本机图片<input id="test-image" disabled type="file" accept="image/*" hidden></label><label class="device-label">摄像头<select id="device"><option value="">默认摄像头</option></select></label></div><p id="camera-status" role="status">点击类别中的摄像头按钮开始采样</p><div id="probabilities"></div></div></section>
</main>
<footer>基于 Teachable Machine Pose · 样本和训练留在本次浏览器会话中</footer>
</body></html>
