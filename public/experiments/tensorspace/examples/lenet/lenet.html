<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
        <title>TensorSpace - LeNet Demo</title>
        <meta name="author" content="syt123450 / https://github.com/syt123450">
        <meta name="author" content="zchholmes / https://github.com/zchholmes">
        <style>

            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
            }

            #container {
                width: calc( 100% - 300px );
                height: 100%;
                background-color: #000;
            }

            #controlPanel {
                width: 300px;
                height: 100%;
                position: absolute;
                background-color: #04242E;
                border-left: 1px solid #6797AE;
                box-sizing: border-box;
                right: 0;
            }

            #clear {
                position: absolute;
                top: 300px;
                left: 38px;
                width: 224px;
                line-height: 50px;
                height: 50px;
                font-size: 25px;
                text-align: center;
                background-color: #000;
                border: 1px solid #6797AE;
                box-sizing: border-box;
                color: #6797AE;
                cursor: pointer;
            }

            .wrapper {
                position: absolute;
                width: 224px;
                height: 224px;
                left: 38px;
                top: 50px;
                -moz-user-select: none;
                -webkit-user-select: none;
                -ms-user-select: none;
                user-select: none;
                z-index: 100;
                background-color: #000;
                border: 1px solid #6797AE;
                box-sizing: border-box;
            }

            .signature-pad {
                position: absolute;
                left: 0;
                top: 0;
                border: 1px solid #000;
            }

        #signature-pad{touch-action:none} @media(max-width:700px){#controlPanel{position:relative;width:100%;height:500px}#container{width:100%;height:650px}} </style>
    </head>
    <body>

        <div id="controlPanel">
            <div class="wrapper">
                <canvas id="signature-pad" class="signature-pad" width=224 height=224></canvas>
            </div>
            <div id="clear">清空画布</div><button id="reset-view" style="position:absolute;top:380px;left:38px;padding:12px">重置视角</button><p id="prediction" role="status" style="position:absolute;top:435px;left:38px;color:#b9dbe6">正在读取模型</p>
        </div>

        <div id="container"></div>

        <script src="../lib/jquery.min.js"></script>
        <script src="../lib/three.min.js"></script>
        <script src="../lib/stats.min.js"></script>
        <script src="../lib/tween.min.js"></script>
        <script src="../lib/TrackballControls.js"></script>
        <script src="../lib/tf.min.js"></script>
        <script src="../lib/signature_pad.min.js"></script>
        <script src="../../dist/tensorspace.js"></script><script src="../lib/lifecycle.js"></script>

        <script src="./runtime-1.js"></script>

        <script src="./runtime-2.js"></script>
    </body>
</html>
