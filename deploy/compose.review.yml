name: donghua-ai

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.review
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATA_DIR: /data
      PUBLIC_ORIGIN: http://ideailab.com
    ports:
      - "80:3001"
    volumes:
      - ../data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
